[package]
name = "switchx"
version = "0.1.0"
edition = "2021"
description = "Universal, ultra-fast subscription account switcher and rolling quota router for Antigravity, Claude Code, and Copilot/Codex"
authors = ["SwitchX Maintainers"]
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
directories = "5.0"
dirs = "5.0"
anyhow = "1.0"
thiserror = "2.0"
colored = "3.0"

[dev-dependencies]
tempfile = "3.17"
